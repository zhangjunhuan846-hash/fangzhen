[project]
name = "Jackowska-2025-JPS"
description = "The Python scripts and results used in the following publication: Transport limitations in single-crystal NCM cathode electrodes by Roksana Jackowska, Nicola E. Courtier, Yongxiu Chen, Brady Planden, David Howey, Carmen Lopez, Dimitra Spathara, and Emma Kendrick, Journal of Power Sources, 2025."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version", "readme"]
dependencies = [
    "anytree==2.13.0",
    "backoff==2.2.1",
    "casadi==3.6.7",
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "cma==4.4.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "dill==0.4.0",
    "distro==1.9.0",
    "fonttools==4.60.1",
    "idna==3.11",
    "jax==0.5.3",
    "jaxlib==0.5.3",
    "kiwisolver==1.4.9",
    "matplotlib==3.10.7",
    "ml-dtypes==0.5.3",
    "mpmath==1.3.0",
    "multiprocess==0.70.18",
    "numpy==1.26.4",
    "opt-einsum==3.4.0",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pints==0.5.1",
    "platformdirs==4.5.0",
    "pooch==1.8.2",
    "posthog==6.7.8",
    "pybamm==25.8.0",
    "pybammsolvers==0.3.1",
    "pybop==25.6",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "salib==1.5.1",
    "scienceplots==2.1.1",
    "scipy==1.16.2",
    "six==1.17.0",
    "sympy==1.14.0",
    "tabulate==0.9.0",
    "threadpoolctl==3.6.0",
    "typing-extensions==4.15.0",
    "tzdata==2025.2",
    "urllib3==2.5.0",
    "xarray==2025.10.1",
]


[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[project.entry-points.pybamm_parameter_sets]
Jackowska2025_2mAh_cm2 = "Jackowska2025:get_parameter_values_2mAh_cm2"
Jackowska2025_4mAh_cm2 = "Jackowska2025:get_parameter_values_4mAh_cm2"
