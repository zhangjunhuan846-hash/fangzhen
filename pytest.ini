# ============================================================
# Battery Dataset Simulation Platform v0.1
# pytest configuration
#
# smoke_test_pipeline.py does not start with ``test_`` (spec file
# name from the task), so the collection pattern is extended to
# also pick up ``smoke_*.py``.
# ============================================================

[pytest]
testpaths = tests
python_files = test_*.py smoke_*.py
python_classes = Test*
python_functions = test_*
