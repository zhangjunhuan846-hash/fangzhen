# ==============================================================================
# MODULE_GRAPH.yaml — 单模块级依赖图与分档
#
# 本文件是 MODULES.yaml 的**细化层**：MODULES.yaml 按目录分档（38 个模块一条），
# 本文件把每一条拆到单文件，并标出**模块与模块之间**的关系。
#
# 为什么需要它：老师指出「要细化得看代码」「模块和模块之间就成了关键」。
# 目录级分档回答不了两个问题：
#   ① 同一个目录里，哪些文件是真核心、哪些是叶子？
#   ② 依赖方向是不是真的单向？
#
# 【生成方式】不是手写，是扫出来的：
#   python scripts/scan_module_graph.py        （静态 AST 分析，不 import pybamm）
#   python scripts/check_module_graph.py       （校验本文件与代码是否一致）
#
# 【判据仍是同一条】删掉它，测试会不会红。本文件只是把粒度从目录降到文件。
# ==============================================================================

meta:
  generated_by: "scripts/scan_module_graph.py"
  generated_on: "2026-09-29"
  scope: "battery_sim / governance / extraction / identification / analysis / user_tools"
  method: "AST 静态解析 import 语句；不拉起 pybamm；相对引用于拼接回绝对名后归约"

