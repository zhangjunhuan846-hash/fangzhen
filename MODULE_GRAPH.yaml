# ==============================================================================
# 二、分层依赖方向 —— 声明与实况的差异（本文件最该看的一节）
# ==============================================================================
cross_layer:
  declared:
    rule: >
      声明为五层单向：① 数据来源 → ② 接入层 → ③ 治理层 → ④ 仿真内核 → ⑤ 识别与报告。
      治理层是被依赖方，不应反向依赖内核。
    source: "MODULES.yaml / module_layering_and_intake.md"

  measured:
    - from: battery_sim.simulation.protocol_replay
      to: governance.scale_alignment
      kind: "lazy（函数体内 import）"
      ok: true
      verdict: >
        **合法**：这是刻意设计的强制点 —— 尺度对齐门是回放的前置条件，
        应由回放自己强制（默认 check）。已在 docs/scale_alignment_gate.md 记录。

    - from: governance.geometry_channel
      to: battery_sim.datasets.material_metadata
      kind: "lazy（函数体内 import）"
      ok: true
      verdict: >
        **原为模块级反向依赖 —— 2026-09-29 已修（v0.1.1）。**
        修复前：`from battery_sim.datasets.material_metadata import load_metadata`
        写在文件顶部 ⇒ `import governance.geometry_channel` 立刻拉起 6 个
        battery_sim 模块，分层单向在导入期破产。
        修复后：该 import 移入 `geometry_override_channel()` 函数体内，与同目录
        `scale_alignment.py` 的既有写法一致。依赖关系与行为均不变，只是导入期不再牵连。
        **实测证据**：修复前导入 governance.geometry_channel 牵连 6 个内核模块，
        修复后为 **0**；本扫描器对该边的判读由 `[module]` 变为 `[lazy]`。
        防回退：`tests/test_module_graph.py::test_no_module_level_back_dependency_remains`

    - from: governance.scale_alignment
      to: battery_sim.models.pybamm_factory
      kind: "lazy"
      ok: true

    - from: governance.scale_alignment
      to: battery_sim.datasets.base
      kind: "lazy"
      ok: true

  conclusion: >
    治理层的 3 处内核依赖**现全部为 lazy**（2026-09-29 前是 2 lazy + 1 模块级）。
    结论：治理层与内核之间**不再有导入期焊接**；分层单向的声明现在与实况一致。
    ⚠️ 注意这里的 "ok: true" 指的是**依赖方向与时机合规**，
    **不代表该依赖本身应该存在** —— geometry_channel 仍需读 metadata 才能
    把实测量翻成 PyBaMM 键，这是它的职责，不是缺陷。
    防回退靠 `scripts/check_module_graph.py`（逐边核对 kind）+ 上述测试。

