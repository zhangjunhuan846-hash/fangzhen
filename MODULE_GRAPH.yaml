    所以"安全"是相对的 —— 见下面标注。
  items:
    - {module: battery_sim.paths, in_degree: 17, tier: core,
       warn: "叶子但高依赖：改它波及全平台"}
    - {module: battery_sim.schemas, in_degree: 8, tier: core,
       warn: "同上，数据形状定义"}
    - {module: battery_sim.logging_utils, in_degree: 4, tier: core}
    - {module: governance.dataset_roles, in_degree: 5, tier: core,
       note: "被 identification 与 user_tools 依赖 —— 治理层里最核心的一个"}
    - {module: battery_sim.datasets.chemistry_windows, in_degree: 3, tier: core}
    - {module: battery_sim.excitation.protocol, in_degree: 3, tier: optional}
    - {module: battery_sim.protocols.chen2020, in_degree: 3, tier: optional}
    - {module: battery_sim.evaluation.metrics, in_degree: 3, tier: optional}
    - {module: extraction.gitt_diffusivity, in_degree: 2, tier: optional}
    - {module: extraction.hires_trace, in_degree: 2, tier: optional}
    - {module: extraction.ocp_extractor, in_degree: 2, tier: optional}
    - {module: battery_sim.evaluation.plotting, in_degree: 2, tier: optional}
    - {module: battery_sim.datasets.ocp_lookup, in_degree: 2, tier: optional}
    - {module: governance.scale_alignment, in_degree: 2, tier: core}
    - {module: user_tools.rg_workstation, in_degree: 2, tier: optional,
