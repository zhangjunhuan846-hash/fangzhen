# ============================================================
# 回收石墨材料元数据（模板）
#
# 用法
#   cp metadata.example.yaml data/raw/LIB/<你的样品>.yaml
#   填完校验：
#     python -m battery_sim.datasets.template --metadata data/raw/LIB/<你的样品>.yaml
#   缺字段会**逐条列出**；errors = 0 才能开始分析。
#
# 为什么这些字段是必填
#   模型侧需要的不是数据文件，而是电极/颗粒的实测量。它们不在任何仪器导出里，
#   只在人手里。缺了它们分析照样能"跑出一个数"，但那个数不可比较也不能复算。
#   D ∝ R²：粒径错一倍，扩散系数差 4 倍。
# ============================================================

sample_id: null                  # 例："RG_500-a"
material_class: null             # pristine | recycled | regenerated | reference | unknown
regeneration_condition: null     # 例："500 °C, Ar 气氛, 2 h"；material_class=pristine 可留空
source: null                     # 例："本实验室 2026-08 批次；LFP 回收线拆解负极"

electrode:
  mass_loading_mg_cm2: null      # 活性物质载量 (mg/cm²)，实测
  coating_thickness_um: null     # 涂层厚度 (µm)，实测（不是标称）
  area_cm2: null                 # 电极几何面积 (cm²)
  binder: null                   # 配方（建议写：PVDF:导电剂:活性物质）
  porosity: null                 # 孔隙率（可选，但模型对它敏感）

particle:
  d50_um: null                   # 粒径中位 D50 (µm)

cell:
  format: "CR2032"
  counter_electrode: null        # 例："Li 片 φ15.6 mm × 0.45 mm（过量）"
  electrolyte: null              # 例："1 M LiPF6 in EC:DEC = 1:1"
  separator: null                # 例："Celgard 2400"

# technique 只能取 TECHNIQUE_VOCAB：
#   GITT | pOCV | CC_charge_discharge | rate_capability | EIS | cycling
# role 只能取：identification | validation | exploration
measurements:
  - technique: GITT
    file: null                   # 相对仓库根的路径
    role: identification
    notes: null                  # 例："C/10, 10 min 脉冲 + 60 min 静置"
  - technique: CC_charge_discharge
    file: null
    role: identification
    notes: null
  - technique: EIS
    file: null
    role: exploration
    notes: null                  # 例："10/50/90 % SOC 各一个点"

# 可选：逐参数来源。审稿人一定会问"这个参数怎么来的"，
# 答案必须落在下面这个词表里（不许写"拟合得到"）。
#   gitt_fitting | eis_fitting | ocv_derived | literature_prior |
#   inferred | parameter_set_default | user_override | not_measured
parameter_sources:
  Ds: null
  k0: null
  Rct: null

# ============================================================
# 结构表征（XRD / Raman / BET）
#
# 三条硬规矩（契约的一部分，越界会报错）：
#   1. **只填测量量**。`id_ig: 1.02` 对；`defect_level: high` 错 ——
#      后者是解释，属于分析层（Phase 3 的"结构 → 参数"关联）。
#   2. **键是闭集**（白名单见 material_metadata.STRUCTURE_FIELDS）。
#      多一个键就是越界，因为自由键会让"这个数从哪来"半年后无法回答。
#   3. **每个块都要给 source**（type/instrument/operator/date）：
#      出现 `BET=56.3` 却不知道谁测的、哪台仪器、哪一天，这个数不能进论文。
#
# 单位写在字段名里（`_nm` / `_cm1` / `_m2_g` / `_cm3_g`）——
# 名字即契约，不做单位换算。
#
# 没测的块**必须**写 available: false + not_available_reason：
# "没测"与"忘了写"在下游完全一样，所以缺失也要有说法。
# ============================================================
structure:

  xrd:
    available: false               # true 时必须给 file / role / wavelength_nm / d002_nm / source
    not_available_reason: null     # 例："样品量不足，未做 XRD"
    file: null                     # 相对仓库根；例 "data/raw/LIB/recycled_graphite/raw/structure/xrd.raw"
    role: null                     # identification | validation | exploration
    wavelength_nm: null            # 例 0.15406 (Cu Kα1)
    d002_nm: null                  # 石墨 d002 ≈ 0.336 nm
    lc_nm: null                    # 可选：沿 c 轴堆叠尺寸
    la_nm: null                    # 可选：面内尺寸
    crystallite_method: null       # 可选：Scherrer / 其它，必须写明
    source:
      type: null                   # experiment | literature | vendor | estimate
      instrument: null
      operator: null
      date: null

  raman:
    available: false
    not_available_reason: null
    file: null
    role: null
    laser_wavelength_nm: null      # 例 532
    id_ig: null                    # 例 1.02（不要写 "缺陷多"）
    g_band_cm1: null               # 可选
    d_band_cm1: null               # 可选
    source:
      type: null
      instrument: null
      operator: null
      date: null

  bet:
    available: false
    not_available_reason: null
    file: null
    role: null
    adsorption_gas: null           # 例 "N2" / "CO2"（微孔要用 CO2）
    surface_area_m2_g: null
    pore_volume_cm3_g: null        # 不要只留面积：回石墨更关心孔结构
    pore_size_distribution: null   # 文件路径，或含 file 的 mapping
    model: null                    # 可选：BET / BJH / DFT / HK
    source:
      type: null
      instrument: null
      operator: null
      date: null
